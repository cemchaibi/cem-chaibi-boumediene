name: توليد الأيقونات وصفحات الأقسام
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site-origin.js'
      - 'logo.png'
      - 'favicon.png'
      - 'scripts/build_pages.py'
      - 'scripts/make_icons.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: تثبيت مكتبة الصور
        run: pip install pillow
      - name: توليد الأيقونات من الشعار
        run: python3 scripts/make_icons.py
      - name: توليد صفحات الأقسام وخريطة الموقع
        run: python3 scripts/build_pages.py
      - name: حفظ الملفات المولّدة
        run: |
          git config user.name "pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html news.html timetable.html media.html qa.html parents.html about.html privacy.html sitemap.xml robots.txt favicon.ico favicon-48.png favicon-96.png favicon-192.png favicon-512.png apple-touch-icon.png icon-maskable-512.png
          git diff --cached --quiet || (git commit -m "chore: توليد الصفحات والأيقونات" && git push)
