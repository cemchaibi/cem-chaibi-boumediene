name: مزامنة الوسائط تلقائياً
on:
  schedule:
    - cron: '17 * * * *'      # كل ساعة
  workflow_dispatch:           # ويمكن تشغيلها يدوياً من تبويب Actions
permissions:
  contents: write
concurrency:
  group: sync-media
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: جلب آخر الفيديوهات والمنشورات
        env:
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 scripts/sync_media.py
      - name: حفظ التغييرات
        run: |
          if ! git diff --quiet -- media-feed.json; then
            git config user.name "media-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add media-feed.json
            git commit -m "chore: مزامنة الوسائط"
            git push
          fi
